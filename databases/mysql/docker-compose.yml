name: eve-insights-mysql

services:
  mysql:
    image: mysql:8.4
    container_name: eve-insights-mysql
    environment:
      MYSQL_DATABASE: eve_insights
      MYSQL_USER: eve
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "eve",
          "-psecret",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
