name: eve-insights-supabase

# Local PostgREST emulator. Insights talks to `rest` with the same
# SUPABASE_URL / SUPABASE_SECRET_KEY pair Vercel Marketplace injects.
# Schema is applied on first volume create only — `docker compose down -v`
# after changing schema.sql.

services:
  db:
    image: postgres:16-alpine
    container_name: eve-insights-supabase-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v12.2.12
    container_name: eve-insights-supabase-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_MAX_ROWS: "4096"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/3000'",
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    container_name: eve-insights-supabase-gateway
    depends_on:
      rest:
        condition: service_healthy
    ports:
      - "54321:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10
    restart: unless-stopped
