name: Release

on:
  push:
    branches: [main, develop, "release/*"]

concurrency:
  # Per-branch: a develop prerelease and a main release are independent and
  # must never cancel each other, but two pushes to the same branch must queue.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Publish @eve-insights/reporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release needs the full history and all tags to work out
          # which commits belong to this release.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Build
        run: pnpm build

      # Publishing uses npm trusted publishing (OIDC) when the package has a
      # trusted publisher registered for this repo + workflow filename; the
      # `id-token: write` permission above is what makes that possible.
      # NPM_TOKEN is only a fallback for the very first publish, before the
      # package exists on npm and a trusted publisher can be configured.
      # Once OIDC is working, delete the secret and the two env lines below.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release
