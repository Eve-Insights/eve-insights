name: CI

on:
  push:
    branches: [main, develop, "release/*", "hotfix/*"]
  pull_request:
    branches: [main, develop, "release/*"]
  # Publishing a beta from develop is a deliberate act, not a side effect of
  # merging. The trusted publisher npm holds is bound to this filename, so the
  # manual trigger has to live here rather than in a workflow of its own.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release from this branch (develop publishes a beta prerelease)."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are safe to cancel; a push may publish, and
  # cancelling that mid-release is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Optional. When TURBO_TOKEN/TURBO_TEAM are set as secrets, unchanged tasks
  # are restored from the remote cache instead of re-run.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Works out which workspaces a task actually has to run for, using Turborepo's
  # own dependency graph — a change to the reporter fans out to everything that
  # depends on it, and a change to root config invalidates all of them.
  affected:
    name: Detect affected workspaces
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.detect.outputs.lint }}
      typecheck: ${{ steps.detect.outputs.typecheck }}
      test: ${{ steps.detect.outputs.test }}
      build: ${{ steps.detect.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Detect
        id: detect
        run: |
          set -euo pipefail

          # Compare against the PR's base, or the previous commit on a push.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # A new branch reports an all-zero "before"; fall back to running
          # everything rather than silently skipping.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base ref — running every workspace."
            FILTER=""
          else
            echo "Comparing against $BASE"
            FILTER="--filter=...[$BASE]"
          fi

          for TASK in lint typecheck test build; do
            # shellcheck disable=SC2086
            MATRIX=$(pnpm exec turbo run "$TASK" $FILTER --dry-run=json 2>/dev/null \
              | jq -c '[.tasks[].package | select(. != "//")
                        | {name: sub("^@eve-insights/"; ""), package: .}]
                       | unique_by(.package)')
            echo "$TASK: $MATRIX"
            echo "$TASK=$MATRIX" >> "$GITHUB_OUTPUT"
          done

  lint:
    name: Lint / ${{ matrix.name }}
    needs: affected
    if: needs.affected.outputs.lint != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.affected.outputs.lint) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: echo "# Lint / ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm exec turbo run lint --filter=${{ matrix.package }}

  # Root config, workflows and .agents metadata sit outside every workspace, so
  # the workspace matrix above would never cover them. Cheap enough to always run.
  lint-repo:
    name: Lint / repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: echo "# Lint / repo" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm lint

  typecheck:
    name: Typecheck / ${{ matrix.name }}
    needs: affected
    if: needs.affected.outputs.typecheck != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.affected.outputs.typecheck) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: echo "# Typecheck / ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      # Not redundant with build: next build typechecks its own project, but
      # tsup (reporter) and eve build (agent) do not.
      - run: pnpm exec turbo run typecheck --filter=${{ matrix.package }}

  test:
    name: Test / ${{ matrix.name }}
    needs: affected
    if: needs.affected.outputs.test != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.affected.outputs.test) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Vitest's job-summary header is a fixed string, so name the page first.
      - run: echo "# Test / ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm exec turbo run test --filter=${{ matrix.package }}

  build:
    name: Build / ${{ matrix.name }}
    needs: affected
    if: needs.affected.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.affected.outputs.build) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: echo "# Build / ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm exec turbo run build --filter=${{ matrix.package }}

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The local commit-msg hook can be bypassed with --no-verify, so this is
      # the gate that actually protects semantic-release's version inference.
      - name: Lint commits in this pull request
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # Single stable check to make required-status-checks practical: the matrix
  # jobs above vary in number and can be skipped entirely, which a required
  # check cannot tolerate.
  ci:
    name: CI
    if: always()
    needs: [affected, lint, lint-repo, typecheck, test, build, commitlint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          set -euo pipefail
          RESULTS='${{ toJSON(needs) }}'
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::At least one CI job failed."
            exit 1
          fi
          echo "All CI jobs passed or were skipped as unaffected."

  # Publishing is gated on the CI job above, so a failing lint, typecheck, test
  # or build stops the release rather than racing it.
  release:
    name: Release
    needs: [ci]
    # `!cancelled()` is required, not decorative: GitHub propagates a skip down
    # the whole dependency chain, and when no workspace is affected every matrix
    # job is skipped, which would skip this job too. `ci` escapes the same way.
    # `always()` would publish from a cancelled run, so it is deliberately not used.
    # needs.ci.result is then what actually gates publishing.
    # Keep on one line: a folded (>) scalar preserves newlines for more-indented
    # continuation lines and GitHub cannot evaluate the result.
    if: ${{ !cancelled() && needs.ci.result == 'success' && ((github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'release/'))) || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release needs full history and all tags to work out which
          # commits belong to this release.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Build
        run: pnpm build

      # Publishing uses npm trusted publishing (OIDC) when the package has a
      # trusted publisher registered for this repo + workflow filename; the
      # `id-token: write` permission above is what makes that possible.
      # NPM_TOKEN is only a fallback for the very first publish, before the
      # package exists on npm and a trusted publisher can be configured.
      # Once OIDC is working, delete the secret and the two env lines below.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release
