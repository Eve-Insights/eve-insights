name: CI

on:
  push:
    branches: [main, develop, "release/*", "hotfix/*"]
  pull_request:
    branches: [main, develop, "release/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fans out like the other tasks so a lint failure names its workspace.
  # The `repo` entry runs the authoritative full-repo pass: nine files
  # (biome.json, turbo.json, release.config.ts, .agents/…) live outside every
  # workspace, and a pure workspace matrix would silently stop checking them.
  lint:
    name: Lint / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: website, path: web/website }
          - { name: docs, path: web/docs }
          - { name: platform, path: apps/platform }
          - { name: agent, path: examples/agent }
          - { name: reporter, path: packages/reporter }
          - { name: repo, path: "." }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Name the summary page after the workspace it covers.
        run: echo "# Lint / ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm exec biome check ${{ matrix.path }}

  # Typecheck, test and build fan out per workspace so a failure names the
  # workspace in the checks list instead of hiding inside one combined job.
  # fail-fast is off so one broken workspace does not mask the others.
  typecheck:
    name: Typecheck / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: website, package: "@eve-insights/website" }
          - { name: docs, package: "@eve-insights/docs" }
          - { name: platform, package: "@eve-insights/platform" }
          - { name: agent, package: "@eve-insights/agent" }
          - { name: reporter, package: "@eve-insights/reporter" }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Name the summary page after the workspace it covers.
      - name: Label the job summary
        run: echo "# Typecheck / ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"

      - run: pnpm exec turbo run typecheck --filter=${{ matrix.package }}

  test:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: website, package: "@eve-insights/website" }
          - { name: docs, package: "@eve-insights/docs" }
          - { name: platform, package: "@eve-insights/platform" }
          - { name: agent, package: "@eve-insights/agent" }
          - { name: reporter, package: "@eve-insights/reporter" }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Vitest's job-summary header is a fixed string, so label the summary
      # with the workspace before the report is appended to it.
      - name: Label the job summary
        run: echo "# Test / ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"

      - run: pnpm exec turbo run test --filter=${{ matrix.package }}

  build:
    name: Build / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: website, package: "@eve-insights/website" }
          - { name: docs, package: "@eve-insights/docs" }
          - { name: platform, package: "@eve-insights/platform" }
          - { name: agent, package: "@eve-insights/agent" }
          - { name: reporter, package: "@eve-insights/reporter" }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Name the summary page after the workspace it covers.
      - name: Label the job summary
        run: echo "# Build / ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"

      - run: pnpm exec turbo run build --filter=${{ matrix.package }}

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The local commit-msg hook can be bypassed with --no-verify, so this is
      # the gate that actually protects semantic-release's version inference.
      - name: Lint commits in this pull request
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
